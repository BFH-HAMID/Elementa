name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22.6 or newer: `npm run check:models` strips TypeScript types with
          # node --experimental-strip-types, which Node 20 does not understand.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Check content maths render
        run: npm run check:math
      - name: Check calculator models
        run: npm run check:models
      - name: Check Honours content structure
        run: npm run check:honours
      - name: Build
        run: npm run build
