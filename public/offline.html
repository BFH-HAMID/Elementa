<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#075db1" />
    <title>PhysChem Lab · অফলাইন</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f7fafc; color: #14283d; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #dbe6f0; border-radius: 24px; background: #fff; box-shadow: 0 18px 55px rgba(20, 40, 61, .12); text-align: center; }
      .logo { width: 56px; height: 56px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg, #075db1, #0e9f78); color: #fff; font-size: 28px; font-weight: 900; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
      p { margin: 12px 0 0; color: #59718e; line-height: 1.7; }
      button { min-height: 44px; margin-top: 24px; padding: 0 18px; border: 0; border-radius: 12px; background: #075db1; color: #fff; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">∫</div>
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>সংরক্ষিত পেজগুলো দেখতে ফিরে যান। সংযোগ ফিরে এলে আবার চেষ্টা করুন।</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
    </main>
  </body>
</html>
