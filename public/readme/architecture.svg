<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">PhysChem Lab static architecture</title>
  <desc id="desc">Repository content flows through Zod and static generation into bilingual pages, while browser-only state powers simulations and local persistence.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#effcf7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14283d" flood-opacity=".1"/></filter><style>.arrow{stroke-dasharray:8 9;animation:dash 4s linear infinite}@keyframes dash{to{stroke-dashoffset:-68}}@media(prefers-reduced-motion:reduce){.arrow{animation:none}}</style></defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif"><g filter="url(#s)"><rect x="45" y="82" width="220" height="250" rx="19" fill="#fff" stroke="#dbe6f0"/><rect x="45" y="82" width="220" height="11" rx="5" fill="#1677d2"/><text x="70" y="130" fill="#14283d" font-size="20" font-weight="800">Repo content</text><text x="70" y="165" fill="#59718e" font-size="14">MDX equations</text><text x="70" y="192" fill="#59718e" font-size="14">Experiment guides</text><text x="70" y="219" fill="#59718e" font-size="14">Quiz JSON</text><text x="70" y="246" fill="#59718e" font-size="14">Translation messages</text><rect x="70" y="275" width="166" height="30" rx="9" fill="#eff7ff"/><text x="86" y="295" fill="#075db1" font-size="12" font-weight="800">git-friendly · reviewable</text></g>
  <g filter="url(#s)"><rect x="340" y="82" width="220" height="250" rx="19" fill="#fff" stroke="#dbe6f0"/><rect x="340" y="82" width="220" height="11" rx="5" fill="#0e9f78"/><text x="365" y="130" fill="#14283d" font-size="20" font-weight="800">Build layer</text><text x="365" y="165" fill="#59718e" font-size="14">Zod schemas</text><text x="365" y="192" fill="#59718e" font-size="14">MDX compiler</text><text x="365" y="219" fill="#59718e" font-size="14">Static params</text><text x="365" y="246" fill="#59718e" font-size="14">Fuse search index</text><rect x="365" y="275" width="166" height="30" rx="9" fill="#effcf7"/><text x="381" y="295" fill="#087d60" font-size="12" font-weight="800">no database · no API</text></g>
  <g filter="url(#s)"><rect x="635" y="82" width="220" height="250" rx="19" fill="#fff" stroke="#dbe6f0"/><rect x="635" y="82" width="220" height="11" rx="5" fill="#f4b942"/><text x="660" y="130" fill="#14283d" font-size="20" font-weight="800">Static pages</text><text x="660" y="165" fill="#59718e" font-size="14">/bn and /en routes</text><text x="660" y="192" fill="#59718e" font-size="14">SEO + OpenGraph</text><text x="660" y="219" fill="#59718e" font-size="14">PWA shell</text><text x="660" y="246" fill="#59718e" font-size="14">Vercel Hobby ready</text><rect x="660" y="275" width="166" height="30" rx="9" fill="#fff8e7"/><text x="676" y="295" fill="#a56800" font-size="12" font-weight="800">fast first load</text></g>
  <g filter="url(#s)"><rect x="930" y="82" width="220" height="250" rx="19" fill="#fff" stroke="#dbe6f0"/><rect x="930" y="82" width="220" height="11" rx="5" fill="#e8795b"/><text x="955" y="130" fill="#14283d" font-size="20" font-weight="800">Browser lab</text><text x="955" y="165" fill="#59718e" font-size="14">Canvas + Matter.js</text><text x="955" y="192" fill="#59718e" font-size="14">3Dmol + R3F</text><text x="955" y="219" fill="#59718e" font-size="14">Zustand localStorage</text><text x="955" y="246" fill="#59718e" font-size="14">CSV + screenshots</text><rect x="955" y="275" width="166" height="30" rx="9" fill="#fff0ec"/><text x="971" y="295" fill="#b84f36" font-size="12" font-weight="800">all interaction client-side</text></g>
  <path class="arrow" d="M270 207h62M565 207h62M860 207h62" fill="none" stroke="#59718e" stroke-width="3"/><path d="m324 198 12 9-12 9m295-18 12 9-12 9m295-18 12 9-12 9" fill="none" stroke="#59718e" stroke-width="3"/>
  <text x="600" y="383" text-anchor="middle" fill="#59718e" font-size="15">One repository → typed content → static deployment → interactive learning</text></g>
</svg>
