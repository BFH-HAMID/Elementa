<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">PhysChem Lab dashboard preview</title>
  <desc id="desc">A stylised preview of the PhysChem Lab responsive dashboard, with equations, experiments, simulations and a live chart.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eefcf7"/></linearGradient>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#075db1"/><stop offset="1" stop-color="#087d60"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14283d" flood-opacity=".13"/></filter>
    <style>.float{animation:float 7s ease-in-out infinite}.line{stroke-dasharray:9 10;animation:move 5s linear infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes move{to{stroke-dashoffset:-76}}@media(prefers-reduced-motion:reduce){.float,.line{animation:none}}</style>
  </defs>
  <rect width="1280" height="820" rx="30" fill="url(#page)"/>
  <rect x="34" y="30" width="1212" height="760" rx="24" fill="#fff" stroke="#dbe6f0" filter="url(#shadow)"/>
  <rect x="34" y="30" width="1212" height="72" rx="24" fill="#fff"/><path d="M34 102h1212" stroke="#dbe6f0"/>
  <rect x="58" y="48" width="38" height="38" rx="11" fill="#075db1"/><text x="77" y="76" text-anchor="middle" fill="#fff" font-family="Arial" font-size="29" font-weight="800">∫</text><text x="110" y="74" fill="#14283d" font-family="Arial" font-size="21" font-weight="800">PhysChem <tspan fill="#087d60">Lab</tspan></text>
