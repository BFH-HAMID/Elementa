  <rect x="462" y="400" width="355" height="172" rx="18" fill="#fff" stroke="#dbe6f0"/><rect x="462" y="400" width="7" height="172" rx="4" fill="#0e9f78"/><circle cx="497" cy="438" r="20" fill="#d7f8e9"/><text x="489" y="446" fill="#087d60" font-family="Arial" font-size="19" font-weight="800">⚗</text><text x="489" y="484" fill="#14283d" font-family="Arial" font-size="19" font-weight="800">Practical experiments</text><text x="489" y="514" fill="#59718e" font-family="Arial" font-size="13">Plan, observe and explain</text><text x="489" y="548" fill="#087d60" font-family="Arial" font-size="13" font-weight="800">Explore →</text>
  <rect x="854" y="400" width="355" height="172" rx="18" fill="#fff" stroke="#dbe6f0"/><rect x="854" y="400" width="7" height="172" rx="4" fill="#f4b942"/><circle cx="889" cy="438" r="20" fill="#fff1c9"/><text x="881" y="446" fill="#a56800" font-family="Arial" font-size="19" font-weight="800">↗</text><text x="881" y="484" fill="#14283d" font-family="Arial" font-size="19" font-weight="800">Interactive simulations</text><text x="881" y="514" fill="#59718e" font-family="Arial" font-size="13">Change a variable. See the result.</text><text x="881" y="548" fill="#a56800" font-family="Arial" font-size="13" font-weight="800">Explore →</text></g>
  <rect x="70" y="614" width="1140" height="134" rx="18" fill="#f1f6fb" stroke="#dbe6f0"/><g font-family="Arial"><text x="98" y="650" fill="#59718e" font-size="11" font-weight="800" letter-spacing="1.5">LIVE LAB SNAPSHOT</text><text x="98" y="696" fill="#075db1" font-size="31" font-weight="800">F = ma</text><text x="275" y="696" fill="#087d60" font-size="31" font-weight="800">pH = −log[H⁺]</text><text x="536" y="696" fill="#a56800" font-size="31" font-weight="800">PV = nRT</text><path class="line" d="M810 704c25-62 55 62 82 0s54-62 82 0 54-62 84 0" fill="none" stroke="#1677d2" stroke-width="3"/><circle cx="1094" cy="704" r="6" fill="#e8795b"/></g>
