  <rect x="70" y="132" width="1140" height="205" rx="22" fill="url(#hero)"/><circle cx="1060" cy="210" r="145" fill="#fff" opacity=".06"/><circle cx="1140" cy="294" r="100" fill="#6ce3bb" opacity=".1"/><text x="102" y="176" fill="#b9dcff" font-family="Arial" font-size="12" font-weight="800" letter-spacing="2">A FREE LEARNING LAB FOR BANGLADESH</text><text x="100" y="224" fill="#fff" font-family="Arial" font-size="35" font-weight="800">Science becomes clear</text><text x="100" y="264" fill="#fff" font-family="Arial" font-size="35" font-weight="800">when you can see it move.</text><text x="101" y="302" fill="#d9edff" font-family="Arial" font-size="14">বাংলা + English · equations · experiments · browser simulations</text><rect x="101" y="315" width="148" height="38" rx="11" fill="#fff"/><text x="121" y="339" fill="#075db1" font-family="Arial" font-size="13" font-weight="800">Explore simulations →</text>
  <g class="float"><circle cx="1052" cy="210" r="46" fill="#e8795b"/><circle cx="1052" cy="210" r="19" fill="#ffd369"/><ellipse cx="1052" cy="210" rx="88" ry="27" fill="none" stroke="#b9dcff" stroke-width="2" opacity=".8" transform="rotate(25 1052 210)"/><ellipse cx="1052" cy="210" rx="88" ry="27" fill="none" stroke="#6ce3bb" stroke-width="2" opacity=".8" transform="rotate(-25 1052 210)"/><circle cx="1125" cy="177" r="8" fill="#72b9ff"/></g>
  <text x="72" y="380" fill="#14283d" font-family="Arial" font-size="20" font-weight="800">Start exploring</text><text x="1080" y="380" fill="#075db1" font-family="Arial" font-size="12" font-weight="800">View all →</text>
