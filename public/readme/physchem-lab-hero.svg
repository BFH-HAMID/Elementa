<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">PhysChem Lab animated learning laboratory</title>
  <desc id="desc">A dark scientific hero image with drifting equations, a glowing atom, and a physics trajectory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2d"/><stop offset=".56" stop-color="#0c2f4a"/><stop offset="1" stop-color="#073c31"/></linearGradient>
    <radialGradient id="blueGlow"><stop stop-color="#72b9ff" stop-opacity=".38"/><stop offset="1" stop-color="#72b9ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="greenGlow"><stop stop-color="#6ce3bb" stop-opacity=".3"/><stop offset="1" stop-color="#6ce3bb" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#72b9ff"/><stop offset="1" stop-color="#6ce3bb"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9dcff" stroke-opacity=".08"/></pattern>
    <style>
      .float{animation:float 8s ease-in-out infinite}.float2{animation:float 11s ease-in-out -3s infinite}.float3{animation:float 13s ease-in-out -6s infinite}.orbit{transform-origin:1120px 347px;animation:spin 18s linear infinite}.orbit2{transform-origin:1120px 347px;animation:spin 12s linear reverse infinite}.dash{stroke-dasharray:12 14;animation:dash 4s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.beam{animation:beam 3.5s ease-in-out infinite}.fade{animation:fade 4s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(14px,-18px) rotate(3deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-52}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}@keyframes beam{0%,100%{opacity:.25}50%{opacity:.9}}@keyframes fade{0%,100%{opacity:.35}50%{opacity:.95}}@media(prefers-reduced-motion:reduce){.float,.float2,.float3,.orbit,.orbit2,.dash,.pulse,.beam,.fade{animation:none}}
    </style>
  </defs>
  <rect width="1400" height="700" rx="34" fill="url(#bg)"/>
  <circle cx="1130" cy="210" r="300" fill="url(#blueGlow)" filter="url(#blur)"/><circle cx="280" cy="650" r="300" fill="url(#greenGlow)" filter="url(#blur)"/><rect width="1400" height="700" rx="34" fill="url(#grid)"/>
  <g opacity=".55" fill="none" stroke="#72b9ff"><path class="dash" d="M46 540C190 470 280 530 414 444s228-36 340-124" stroke-width="2"/><path class="dash" d="M850 574c98-64 122-144 230-190s174-35 274-120" stroke="#6ce3bb" stroke-width="2"/></g>
  <g filter="url(#shadow)"><rect x="82" y="92" width="78" height="78" rx="21" fill="#1677d2"/><text x="121" y="151" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="800">∫</text></g>
  <text x="186" y="139" fill="#edf5fc" font-family="Arial, sans-serif" font-size="48" font-weight="800">PhysChem <tspan fill="#6ce3bb">Lab</tspan></text>
  <text x="88" y="283" fill="#fff" font-family="Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">Learn it. See it. Try it.</text>
  <text x="92" y="332" fill="#b9cfe1" font-family="Arial, sans-serif" font-size="25">A bilingual browser laboratory for curious learners in Bangladesh</text>
  <g class="float" transform="translate(98 410)"><rect width="235" height="76" rx="19" fill="#123d66" stroke="#4b9ee4" stroke-opacity=".55"/><text x="24" y="33" fill="#72b9ff" font-family="monospace" font-size="17">PHYSICS</text><text x="24" y="61" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">F = ma</text></g>
  <g class="float2" transform="translate(360 512)"><rect width="282" height="76" rx="19" fill="#073c31" stroke="#3cc398" stroke-opacity=".62"/><text x="24" y="33" fill="#6ce3bb" font-family="monospace" font-size="17">CHEMISTRY</text><text x="24" y="61" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">pH = −log₁₀[H⁺]</text></g>
  <g class="float3" transform="translate(690 411)"><rect width="202" height="76" rx="19" fill="#4b3510" stroke="#f4b942" stroke-opacity=".7"/><text x="24" y="33" fill="#ffd369" font-family="monospace" font-size="17">SIMULATION</text><text x="24" y="61" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">PV = nRT</text></g>
  <g class="pulse"><circle cx="1120" cy="347" r="122" fill="none" stroke="#72b9ff" stroke-opacity=".24" stroke-width="2"/><circle cx="1120" cy="347" r="84" fill="none" stroke="#6ce3bb" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 12"/><circle cx="1120" cy="347" r="31" fill="#e8795b"/><circle cx="1120" cy="347" r="18" fill="#ffd369"/></g>
  <g class="orbit"><circle cx="1120" cy="225" r="12" fill="#72b9ff"/><path d="M1120 225a122 122 0 0 1 0 244" fill="none" stroke="#72b9ff" stroke-opacity=".25"/></g><g class="orbit2"><circle cx="1204" cy="347" r="10" fill="#6ce3bb"/></g>
  <g class="beam" fill="none" stroke="url(#line)" stroke-width="3"><path d="M1016 571h210"/><path d="M1028 571l92-224 93 224"/><path d="M1062 505l58-158 60 158"/></g>
  <text x="1018" y="626" fill="#b9cfe1" font-family="Arial, sans-serif" font-size="18">equations · experiments · interactive labs</text>
</svg>
