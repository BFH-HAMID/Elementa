<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Animated projectile simulation preview</title>
  <desc id="desc">A projectile travels along a parabolic path above a ground line with live equations and readouts.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2d"/><stop offset="1" stop-color="#123d66"/></linearGradient><linearGradient id="path" x1="0" x2="1"><stop stop-color="#72b9ff"/><stop offset="1" stop-color="#6ce3bb"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><style>.fly{offset-path:path('M 112 328 C 260 38 510 38 790 328');offset-distance:0%;animation:fly 4.8s cubic-bezier(.45,.05,.55,.95) infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}@keyframes fly{0%{offset-distance:0%}55%{offset-distance:55%}100%{offset-distance:100%}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.fly,.pulse{animation:none}}</style></defs>
  <rect width="900" height="430" rx="28" fill="url(#bg)"/><path d="M70 338h760" stroke="#d9edff" stroke-width="2" opacity=".5"/><path d="M112 328C260 38 510 38 790 328" fill="none" stroke="#72b9ff" stroke-opacity=".22" stroke-width="11" filter="url(#glow)"/><path d="M112 328C260 38 510 38 790 328" fill="none" stroke="url(#path)" stroke-width="3" stroke-dasharray="9 11"/>
  <g class="fly"><circle r="18" fill="#e8795b" opacity=".4" filter="url(#glow)"/><circle r="10" fill="#ffd369" stroke="#fff" stroke-width="2"/></g><circle class="pulse" cx="112" cy="328" r="7" fill="#6ce3bb"/><circle class="pulse" cx="790" cy="328" r="7" fill="#6ce3bb"/>
  <g font-family="Arial, sans-serif"><text x="62" y="62" fill="#fff" font-size="25" font-weight="800">Projectile motion</text><text x="64" y="91" fill="#b9cfe1" font-size="14">move the angle · watch the range · record the data</text><rect x="64" y="126" width="205" height="84" rx="15" fill="#0c2236" stroke="#29465e"/><text x="84" y="153" fill="#72b9ff" font-size="12" font-weight="800">FORMULA USED</text><text x="84" y="187" fill="#fff" font-family="monospace" font-size="21" font-weight="700">R = u² sin(2θ) / g</text><rect x="638" y="122" width="184" height="108" rx="15" fill="#0c2236" stroke="#29465e"/><text x="658" y="151" fill="#6ce3bb" font-size="12" font-weight="800">LIVE READOUT</text><text x="658" y="181" fill="#fff" font-size="15">Range   31.9 m</text><text x="658" y="207" fill="#fff" font-size="15">Height  4.1 m</text><text x="72" y="374" fill="#b9cfe1" font-size="13">Canvas 2D · Recharts graph · CSV export</text><text x="730" y="374" fill="#ffd369" font-size="13">u = 18 m/s · θ = 45°</text></g>
</svg>
